# Weekly, grouped, so updates arrive as a few pull requests and not dozens.
# CI runs on each, and nothing merges without a person.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose through pnpm-workspace.yaml: jsdom 27 and later
      # require() ES modules, which Vercel's functions refuse.
      - dependency-name: jsdom
        versions: [">=27"]
      # Node's types describe the oldest Node the app runs on: 22, in CI and
      # the Docker image (Vercel runs 24). Newer types would let code use APIs
      # that do not exist there. Raise this by hand with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
