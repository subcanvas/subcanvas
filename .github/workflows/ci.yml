name: CI

on:
  pull_request:
  # The deploy workflow runs these checks on main before it deploys.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned so generated types do not change under us. Keep in step
          # with the CLI used locally.
          version: 2.110.0
      - run: supabase db start
      - run: supabase test db
      - name: Generated types match the migrations
        run: |
          supabase gen types typescript --local > src/lib/supabase/database.types.ts
          git diff --exit-code -- src/lib/supabase/database.types.ts \
            || { echo "::error::Run 'pnpm db:types' and commit the result."; exit 1; }
