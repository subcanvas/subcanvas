name: CI

on:
  pull_request:
  # The deploy workflow runs these checks on main before it deploys.
  workflow_call:

jobs:
  check:
    # Pinned: "ubuntu-latest" moves to a new release on GitHub's schedule, and
    # the database job depends on the image's Docker. Move all runners
    # (these and the one in deploy.yml) together, on purpose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  # The build is not enough: a dependency can import fine at build time and
  # fail when the server runs it. Vercel's runtime refuses require() of an
  # ESM-only package, which once broke /mcp and Import from GitHub in
  # production while every other check was green. NODE_OPTIONS reproduces
  # that refusal here.
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.110.0
      - run: pnpm install --frozen-lockfile
      # The whole stack, not just the database: every page asks the Auth API
      # who is signed in, and answers 500 when nothing is listening.
      # Signed in, the registry allows far more pulls than it does a stranger.
      # Three jobs each pull the whole stack, and a busy day of runs from
      # GitHub's shared addresses is refused as "toomanyrequests" otherwise.
      - name: Sign in to the container registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Start the stack the server talks to
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime
      # The local stack's keys are the same on every machine and grant
      # nothing anywhere else, so they are printed, not hidden.
      - name: Build and serve as production does
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          key=$(supabase status -o env | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$key"
          pnpm build
          # Set so /terms and /privacy render, as they do in production.
          export LEGAL_OPERATOR="CI" LEGAL_CONTACT="ci@example.test" LEGAL_GOVERNING_LAW="California"
          NODE_OPTIONS=--no-experimental-require-module pnpm start &
          for _ in $(seq 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
            sleep 2
          done
      - name: Every route answers, and none of them 500
        run: |
          fail=0
          check() { # path, expected status
            actual=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$1")
            if [ "$actual" = "$2" ]; then
              echo "ok    $1 -> $actual"
            else
              echo "::error::$1 answered $actual, expected $2"
              fail=1
            fi
          }
          check / 200
          check /login 200
          check /terms 200
          check /privacy 200
          check /robots.txt 200
          check /sitemap.xml 200
          check /favicon.ico 200
          # The MCP endpoint must reject an unauthenticated call, not fail to
          # load. A 500 here is the ESM-only import problem.
          check /mcp 401
          check /p/00000000-0000-0000-0000-000000000000 404
          exit $fail

  # The smoke job proves every page answers. This one proves the app works:
  # a browser signs up, makes a whiteboard, and finds what it drew still
  # there after a reload, which is the only way to see Yjs reach Postgres
  # and come back. Same stack, same build, same runtime flag as above.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.110.0
      - run: pnpm install --frozen-lockfile
      # Chromium only: the suite tests this app, not browser differences.
      - name: Install the browser the tests drive
        run: pnpm exec playwright install --with-deps chromium
      # Signed in, the registry allows far more pulls than it does a stranger.
      # Three jobs each pull the whole stack, and a busy day of runs from
      # GitHub's shared addresses is refused as "toomanyrequests" otherwise.
      - name: Sign in to the container registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Start the stack the server talks to
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime
      - name: Build and serve as production does
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          key=$(supabase status -o env | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$key"
          pnpm build
          export LEGAL_OPERATOR="CI" LEGAL_CONTACT="ci@example.test" LEGAL_GOVERNING_LAW="California"
          NODE_OPTIONS=--no-experimental-require-module pnpm start --port 3310 &
          # localhost, not 127.0.0.1: see the note in playwright.config.ts.
          for _ in $(seq 60); do
            curl -fsS -o /dev/null http://localhost:3310/ && break
            sleep 2
          done
      # The config reuses the server already listening rather than building
      # a second time.
      - run: pnpm test:e2e
      - name: The report, when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Pinned so generated types do not change under us. Keep in step
          # with the CLI used locally.
          version: 2.110.0
      # Signed in, the registry allows far more pulls than it does a stranger.
      # Three jobs each pull the whole stack, and a busy day of runs from
      # GitHub's shared addresses is refused as "toomanyrequests" otherwise.
      - name: Sign in to the container registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: supabase db start
      - run: supabase test db
      - name: Generated types match the migrations
        run: |
          supabase gen types typescript --local > src/lib/supabase/database.types.ts
          git diff --exit-code -- src/lib/supabase/database.types.ts \
            || { echo "::error::Run 'pnpm db:types' and commit the result."; exit 1; }
